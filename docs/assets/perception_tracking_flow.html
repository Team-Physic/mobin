<desc id="perception-tracking-desc">원본 binary mask와 LiDAR를 시간·TF 기준으로 연결하고 가림·지면을 제외한 뒤, instance별 유효 깊이 후보의 지지를 검사한다. 선택한 관측은 odom으로 변환한다. 선택된 관측이 없어도 frame 결과로 Kalman·Hungarian tracker를 갱신하며, 필터 통과는 사람 소속의 보증이 아니다.</desc>
