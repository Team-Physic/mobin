semantic_safety:
  ros__parameters:
    command_topic: /cmd_vel_mux
    output_topic: /cmd_vel_safe
    scan_topic: /scan
    odom_topic: /odom
    tracks_topic: /tracking/persons
    caution_t_cpa: 4.0
    danger_t_cpa: 2.0
    prediction_horizon: 6.0
    caution_scale: 0.5
    robot_radius: 0.30
    person_radius: 0.35
    safety_margin: 0.20
    front_emergency_distance: 0.60
    rear_emergency_distance: 0.40
    side_emergency_distance: 0.45
    tracking_stale_speed: 0.15
    stable_safe_duration: 1.0
    scan_timeout: 0.2
    odom_timeout: 0.2
    tracking_timeout: 0.5

cmd_vel_watchdog:
  ros__parameters:
    input_topic: /cmd_vel_safe
    output_topic: /cmd_vel
    timeout: 0.3
